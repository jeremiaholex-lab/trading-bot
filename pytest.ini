[pytest]
# Only collect from tests/. Without this, pytest's default `test_*.py` glob
# picks up root-level scripts (e.g. test_scan.py) and *imports* them, which
# executed the live trading loop and placed real Alpaca orders on every
# `pytest` invocation.
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
