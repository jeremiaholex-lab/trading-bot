<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="Walk-forward optimizer and adoption gates: history is split 70% train and 30% holdout; the best candidate is picked on the train set and scored exactly once on the holdout; then three gates must all pass - fitness at least zero, at least 0.25 improvement over the parameters in use, and at least three holdout trades - before the parameters are adopted, otherwise the defaults are kept.">
  <style>
    svg {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --card: #fcfcfb;
      --cardborder: rgba(11,11,11,0.10);
      --ink: #0b0b0b;
      --ink2: #52514e;
      --muted: #898781;
      --arrow: #898781;
      --wf: #6250d6;
      --train: #2a78d6;
      --hold: #1baf7a;
      --gate: #eb6834;
      --adopt: #0ca30c;
      --keep: #898781;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --card: #1a1a19;
        --cardborder: rgba(255,255,255,0.10);
        --ink: #f0efec;
        --ink2: #c3c2b7;
        --muted: #898781;
        --arrow: #898781;
        --wf: #9085e9;
        --train: #3987e5;
        --hold: #199e70;
        --gate: #d95926;
        --adopt: #0ca30c;
        --keep: #898781;
      }
    }
    .t { font-size: 14px; font-weight: 700; fill: var(--ink); }
    .s { font-size: 11px; font-weight: 400; fill: var(--ink2); }
    .gt { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
    .gs { font-size: 10.5px; font-weight: 400; fill: var(--ink2); }
    .flow { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
    .group { font-size: 11.5px; font-weight: 600; fill: var(--muted); }
    .branch { font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="var(--card)" stroke="var(--cardborder)"/>

  <!-- A: walk-forward -->
  <g>
    <rect x="16" y="60" width="150" height="70" rx="9" fill="var(--wf)" fill-opacity="0.12" stroke="var(--wf)" stroke-width="1.5"/>
    <text class="t" x="91" y="88" text-anchor="middle">Walk-forward</text>
    <text class="s" x="91" y="107" text-anchor="middle">70% train · 30% holdout</text>
  </g>
  <line class="flow" x1="166" y1="95" x2="206" y2="95" marker-end="url(#ah3)"/>

  <!-- B: pick best on train -->
  <g>
    <rect x="214" y="60" width="150" height="70" rx="9" fill="var(--train)" fill-opacity="0.12" stroke="var(--train)" stroke-width="1.5"/>
    <text class="t" x="289" y="88" text-anchor="middle">Pick best on train</text>
    <text class="s" x="289" y="107" text-anchor="middle">highest train fitness</text>
  </g>
  <line class="flow" x1="364" y1="95" x2="404" y2="95" marker-end="url(#ah3)"/>

  <!-- C: score once on holdout -->
  <g>
    <rect x="412" y="60" width="150" height="70" rx="9" fill="var(--hold)" fill-opacity="0.12" stroke="var(--hold)" stroke-width="1.5"/>
    <text class="t" x="487" y="88" text-anchor="middle">Score on holdout</text>
    <text class="s" x="487" y="107" text-anchor="middle">once, on the train winner</text>
  </g>
  <line class="flow" x1="562" y1="95" x2="592" y2="95" marker-end="url(#ah3)"/>

  <!-- Gate group -->
  <text class="group" x="782" y="48" text-anchor="middle">All three must pass</text>
  <g>
    <rect x="600" y="60" width="100" height="70" rx="9" fill="var(--gate)" fill-opacity="0.12" stroke="var(--gate)" stroke-width="1.5"/>
    <text class="gt" x="650" y="88" text-anchor="middle">Fitness ≥ 0</text>
    <text class="gs" x="650" y="107" text-anchor="middle">absolute floor</text>
  </g>
  <g>
    <rect x="732" y="60" width="100" height="70" rx="9" fill="var(--gate)" fill-opacity="0.12" stroke="var(--gate)" stroke-width="1.5"/>
    <text class="gt" x="782" y="88" text-anchor="middle">Margin ≥ .25</text>
    <text class="gs" x="782" y="107" text-anchor="middle">over baseline</text>
  </g>
  <g>
    <rect x="864" y="60" width="100" height="70" rx="9" fill="var(--gate)" fill-opacity="0.12" stroke="var(--gate)" stroke-width="1.5"/>
    <text class="gt" x="914" y="88" text-anchor="middle">Trades ≥ 3</text>
    <text class="gs" x="914" y="107" text-anchor="middle">not noise</text>
  </g>

  <!-- Branch to ADOPT / KEEP -->
  <line class="flow" x1="782" y1="130" x2="782" y2="158"/>
  <line class="flow" x1="675" y1="158" x2="890" y2="158"/>
  <line class="flow" x1="675" y1="158" x2="675" y2="192" marker-end="url(#ah3)"/>
  <line class="flow" x1="890" y1="158" x2="890" y2="192" marker-end="url(#ah3)"/>
  <text class="branch" x="687" y="180" fill="var(--adopt)">all pass</text>
  <text class="branch" x="902" y="180" fill="var(--muted)">any fails</text>

  <g>
    <rect x="600" y="200" width="150" height="60" rx="9" fill="var(--adopt)" fill-opacity="0.20" stroke="var(--adopt)" stroke-width="1.5"/>
    <text class="t" x="675" y="227" text-anchor="middle">ADOPT params</text>
    <text class="s" x="675" y="245" text-anchor="middle">into strategy_state.json</text>
  </g>
  <g>
    <rect x="820" y="200" width="140" height="60" rx="9" fill="var(--keep)" fill-opacity="0.16" stroke="var(--keep)" stroke-width="1.5"/>
    <text class="t" x="890" y="227" text-anchor="middle">KEEP defaults</text>
    <text class="s" x="890" y="245" text-anchor="middle">never adopt unvalidated</text>
  </g>
</svg>
